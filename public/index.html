<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Consumer Research Interview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0B1D2E;--teal:#0891B2;--tlt:#22D3EE;--tbg:#ECFEFF;--green:#059669;--red:#DC2626;--amber:#D97706;--tx:#1E293B;--tx2:#475569;--tx3:#94A3B8;--bg:#F8FAFC;--bdr:#E2E8F0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.scr{min-height:100dvh;display:flex;flex-direction:column}
.welcome{background:var(--navy);align-items:center;justify-content:center;text-align:center;padding:2rem}
.welcome h1{color:#fff;font-size:1.75rem;margin-bottom:.75rem;line-height:1.2}
.logo{width:64px;height:64px;background:var(--teal);border-radius:16px;display:grid;place-items:center;margin:0 auto 1.5rem}
.sub{color:var(--tlt);font-size:1.05rem;margin-bottom:.5rem}
.dsc{color:var(--tx3);font-size:.85rem;max-width:26rem;margin:0 auto 2rem;line-height:1.5}
.btn-go{background:var(--teal);color:#fff;font-size:1.05rem;font-weight:600;padding:.9rem 2rem;border:none;border-radius:12px;display:inline-flex;align-items:center;gap:.5rem}
.btn-go:hover{opacity:.9}.btn-go:active{transform:scale(.97)}
.hdr{background:#fff;border-bottom:1px solid var(--bdr);padding:.6rem 1rem;position:sticky;top:0;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.hdr-in{max-width:38rem;margin:0 auto;display:flex;align-items:center;gap:.6rem}
.hdr-ico{width:30px;height:30px;background:var(--teal);border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.hdr-sec{font-size:.7rem;font-weight:600;color:var(--teal)}.hdr-q{font-size:.65rem;color:var(--tx3)}
.hdr-r{margin-left:auto}
.ib{width:34px;height:34px;border-radius:8px;border:none;display:grid;place-items:center;background:transparent;color:var(--tx3)}
.ib:hover{background:#f1f5f9}.ib.on{background:var(--tbg);color:var(--teal)}
.prog{max-width:38rem;margin:.4rem auto 0;height:3px;background:var(--bdr);border-radius:3px;overflow:hidden}
.prog-f{height:100%;background:var(--teal);border-radius:3px;transition:width .6s ease-out}
.chat{flex:1;overflow-y:auto;padding:1rem}
.chat-in{max-width:38rem;margin:0 auto;display:flex;flex-direction:column;gap:.8rem}
.m{display:flex}.m-u{justify-content:flex-end}
.b{border-radius:1rem;padding:.65rem .9rem;font-size:.87rem;line-height:1.55;max-width:82%}
.b-ai{background:#fff;border:1px solid var(--bdr);border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.b-u{background:var(--teal);color:#fff;border-bottom-right-radius:4px}
.ai-h{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.ai-d{width:16px;height:16px;background:var(--tbg);border-radius:50%;display:grid;place-items:center}
.ai-l{font-size:.65rem;font-weight:600;color:var(--teal)}
.dots{display:flex;gap:3px;margin-left:3px}
.dots span{width:3px;height:3px;background:var(--teal);border-radius:50%;animation:p .8s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes p{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.cur{display:inline-block;width:2px;height:14px;background:var(--teal);margin-left:1px;vertical-align:text-bottom;animation:bk 1s step-end infinite}
@keyframes bk{50%{opacity:0}}
.wave{display:flex;align-items:center;gap:2px;height:18px;margin-left:5px}
.wave span{width:3px;border-radius:2px;background:var(--teal);animation:wv .6s ease-in-out infinite}
.wave span:nth-child(1){height:7px}.wave span:nth-child(2){height:14px;animation-delay:.1s}
.wave span:nth-child(3){height:9px;animation-delay:.2s}.wave span:nth-child(4){height:12px;animation-delay:.3s}
@keyframes wv{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1.2)}}
.ix{background:#fff;border:1px solid var(--bdr);border-radius:12px;padding:.9rem;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.ix-l{font-size:.65rem;color:var(--tx3);margin-bottom:.6rem}
.ri{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;border:1px solid var(--bdr);border-radius:10px;margin-bottom:.4rem;cursor:pointer;transition:all .12s;background:#f8fafc;font-size:.85rem}
.ri:hover{border-color:var(--teal);background:var(--tbg)}.ri:active{transform:scale(.98)}
.ri-d{background:var(--tbg);border-color:#99f6e4;cursor:default}
.rn{width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.rd{font-size:.7rem;color:var(--tx3);margin-left:auto}
.rst{font-size:.65rem;color:var(--tx3);border:none;background:none;text-decoration:underline;margin-top:.2rem;cursor:pointer}
.oc{width:100%;text-align:left;padding:.9rem;border:2px solid var(--bdr);border-radius:12px;margin-bottom:.4rem;cursor:pointer;transition:all .12s;background:#fff}
.oc:hover{border-color:var(--teal)}.oc:active{transform:scale(.98)}
.oc .ol{font-size:.65rem;font-weight:700;color:var(--tx3);margin-bottom:3px}
.oc .ot{font-size:.85rem;font-style:italic;color:var(--tx)}
.oc-r{border-color:#fecaca;background:#fef2f2}.oc-a{border-color:#fde68a;background:#fffbeb}.oc-g{border-color:#a7f3d0;background:#ecfdf5}
.inp{background:#fff;border-top:1px solid var(--bdr);padding:.6rem .8rem;position:sticky;bottom:0;box-shadow:0 -2px 6px rgba(0,0,0,.04)}
.inp-in{max-width:38rem;margin:0 auto;display:flex;align-items:flex-end;gap:.4rem}
.mic{width:42px;height:42px;border-radius:12px;border:none;display:grid;place-items:center;flex-shrink:0;transition:all .2s}
.mic-off{background:#f1f5f9;color:var(--tx3)}.mic-off:hover{background:#e2e8f0}
.mic-on{background:var(--red);color:#fff}
.ti{flex:1;border:1px solid var(--bdr);border-radius:12px;padding:.65rem .9rem;font-size:.87rem;resize:none;min-height:80px;max-height:200px;font-family:inherit;outline:none}
.ti:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(8,145,178,.12)}
.ti:disabled{background:#f8fafc;color:var(--tx3)}
.snd{width:42px;height:42px;border-radius:12px;border:none;background:var(--teal);color:#fff;display:grid;place-items:center;flex-shrink:0}
.snd:disabled{opacity:.25;cursor:default}.snd:not(:disabled):active{transform:scale(.95)}
.mic-st{text-align:center;font-size:.65rem;color:var(--tx3);margin-top:.4rem}
.thx{background:var(--navy);align-items:center;justify-content:center;text-align:center;padding:2rem}
.chk{width:64px;height:64px;background:var(--green);border-radius:50%;display:grid;place-items:center;margin:0 auto 1.5rem}
.thx h1{color:#fff;font-size:1.75rem;margin-bottom:.75rem}.thx .sub{margin-bottom:2rem}
.btn2{background:#334155;color:#fff;padding:.7rem 1.25rem;border:none;border-radius:12px;font-size:.85rem}
.admin{padding:1.5rem 1rem;max-width:48rem;margin:0 auto}
.admin h1{font-size:1.5rem;margin-bottom:.25rem}.admin .cnt{font-size:.85rem;color:var(--tx3);margin-bottom:1.5rem}
.btn-ins{background:var(--teal);color:#fff;padding:.5rem 1rem;border:none;border-radius:8px;font-size:.85rem;display:flex;align-items:center;gap:.5rem;margin-bottom:1rem}.btn-ins:disabled{opacity:.5}
.ins-box{background:#fff;border-left:4px solid var(--teal);border-radius:12px;padding:1.25rem;margin-bottom:1.5rem}
.ins-box h2{color:var(--teal);font-size:1rem;margin-bottom:.75rem}
.ins-box pre{font-family:inherit;white-space:pre-wrap;font-size:.85rem;line-height:1.6;color:var(--tx2)}
.rc{background:#fff;border:1px solid var(--bdr);border-radius:12px;margin-bottom:.75rem;overflow:hidden}
.rc summary{padding:1rem 1.25rem;cursor:pointer;font-weight:600;font-size:.9rem}
.rc-body{padding:0 1.25rem 1.25rem;border-top:1px solid var(--bdr)}
.rc-body .qa{margin-top:1rem}
.rc-body .st{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--teal);margin-bottom:4px}
.rc-body .qt{font-size:.85rem;font-weight:500;color:var(--tx2);margin-bottom:4px}
.rc-body .at{font-size:.85rem;color:var(--tx2);background:#f1f5f9;border-radius:8px;padding:.5rem .75rem}
.bk{font-size:.85rem;color:var(--teal);border:none;background:none;margin-bottom:1rem;cursor:pointer;display:flex;align-items:center;gap:4px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CHAR_SPEED=65;
const QS=[
{id:"q1",type:"open",section:"Warm-Up",text:"Think about the last time a brand or company invited you to take a survey. What went through your mind? Did you do it?",probes:["What was your gut reaction \u2014 before you even looked at the details?","If you skipped it: was it a conscious decision or did you just not bother? What would have had to be different?","If you did it: what was the thing that made you say yes?"]},
{id:"q2",type:"open",section:"Barriers",text:"When you decide not to participate in a survey, what are the main reasons? Walk me through what kills it for you.",probes:["Is it about time? Trust? The reward? The topic? Something else?","Is there a difference between \u2018I would never do this\u2019 vs. \u2018I might, but not right now\u2019?"]},
{id:"q3",type:"rank",section:"Barriers",text:"If you had to rank what matters most in your decision \u2014 is it more about WHO is asking, WHAT they\u2019re offering, WHEN they ask, or HOW they frame it?",inst:"Tap in order of importance (1 = most important)",opts:[{id:"who",lb:"WHO is asking",ds:"The brand or sender"},{id:"what",lb:"WHAT they\u2019re offering",ds:"The incentive or reward"},{id:"when",lb:"WHEN they ask",ds:"The timing and context"},{id:"how",lb:"HOW they frame it",ds:"The messaging and positioning"}]},
{id:"q4",type:"open",section:"Incentives",text:"Let\u2019s talk about incentives. When a survey offers you something in return, what kind of reward actually moves the needle for you? What feels worth your time vs. what feels insulting?",probes:["Has a cash incentive ever worked for you? At what amount does cash start to feel worth it?","What about non-cash incentives \u2014 experiences, access to something, credits? Does that change anything?"]},
{id:"q5",type:"rank",section:"Incentives",text:"I\u2019m going to read you a list of incentive options for a 30-minute survey about products you buy regularly. Rank them from most to least appealing.",inst:"Tap in order of preference (1 = most appealing)",opts:[{id:"a",lb:"$50 cash (Venmo / PayPal)"},{id:"b",lb:"$50 in DoorDash or Amazon credits"},{id:"c",lb:"Two tickets to a local sports game or concert"},{id:"d",lb:"A wellness day pass (spa, gym, yoga) for you + 1"},{id:"e",lb:"$25 cash + tickets to a local event of your choice"},{id:"f",lb:"Free coffee every day for a week at your regular cafe"},{id:"g",lb:"Entry into a raffle for a high-value experience (e.g., World Cup final trip, weekend getaway)"}]},
{id:"q5b",type:"open",section:"Incentives",text:"Tell me about your top pick \u2014 why does that one win? And your bottom pick \u2014 why does that fall flat?",probes:[],dynamic:true},
{id:"q6",type:"open",section:"Moment & Context",text:"Think about your typical week. Are there specific moments where you\u2019d actually be open to spending 30 minutes on a survey \u2014 times when you\u2019re idle, waiting, or winding down?",probes:["What about right after you\u2019ve bought something \u2014 like a new product you were excited about? Would a survey about that product feel different?","Does it matter if you\u2019d do it on your phone vs. desktop?"]},
{id:"q7",type:"select",section:"Framing & Credibility",text:"I\u2019m going to show you three versions of the same survey invitation. Which one would you be most likely to click on?",opts:[{id:"o1",lb:"Option 1",tx:"Fill out a quick survey and earn $50.",cl:"r"},{id:"o2",lb:"Option 2",tx:"Take a 20-minute survey about [category] and earn $50 cash.",cl:"a"},{id:"o3",lb:"Option 3",tx:"Help us make better products for your dog \u2014 join our insider panel. Takes 20 minutes.",cl:"g"}]},
{id:"q7b",type:"open",section:"Framing & Credibility",text:"What\u2019s different about the one you picked? What does it signal to you about the brand?",probes:["Does removing the cash incentive from Option 3 make it less appealing, or does it not matter?"]},
{id:"q8",type:"open",section:"Framing & Credibility",text:"Two quick follow-ups. First: does it matter how long a survey is? Where\u2019s the line where you\u2019d say \u2018that\u2019s too long\u2019? And second: does it matter who\u2019s asking? Would you respond differently if the survey came from a brand you love vs. an unknown research company?",probes:["What if the invite came from a specific person \u2014 like your barista at your usual Starbucks or local coffee shop?","What about data privacy \u2014 does knowing how your answers will be used matter?"]}
];
const IC={msg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',snd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>',micX:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2c0 .76-.13 1.49-.35 2.17"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>',vol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>',volX:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>',chk:'<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>',arr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>',bk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>',bar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>'};
function ic(n,w=16){return`<span style="display:inline-flex;width:${w}px;height:${w}px">${IC[n]}</span>`}

// ─── TTS: Prefetch audio THEN start typing in sync ───
let curAudio=null,bestVoice=null;
function loadVoices(){if(!window.speechSynthesis)return;const vs=speechSynthesis.getVoices();if(!vs.length)return;const prefs=["Microsoft Aria","Google US English","Samantha"];for(const p of prefs){const v=vs.find(v=>v.name.includes(p));if(v){bestVoice=v;return}}bestVoice=vs.find(v=>v.lang.startsWith("en"))||vs[0]}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=loadVoices;setTimeout(loadVoices,100)}
function stopAll(){if(curAudio){curAudio.pause();curAudio=null}if(window.speechSynthesis)speechSynthesis.cancel()}

// Prefetch audio, then start typing + audio together
async function speakAndType(text,msgIdx){
  stopAll();
  if(!S.tts){beginTyping(text,msgIdx);return}
  // 1. Fetch audio first
  let audio=null;
  try{
    const r=await fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
    const ct=r.headers.get("content-type")||"";
    if(ct.includes("audio")){
      const blob=await r.blob();
      audio=new Audio(URL.createObjectURL(blob));
      // Wait for audio to be ready
      await new Promise((ok,fail)=>{audio.oncanplaythrough=ok;audio.onerror=fail;setTimeout(ok,3000);audio.load()});
    }
  }catch{}
  // 2. NOW start both together
  beginTyping(text,msgIdx);
  if(audio){curAudio=audio;audio.play().catch(()=>{})}
  else if(window.speechSynthesis){loadVoices();const u=new SpeechSynthesisUtterance(text);u.voice=bestVoice;u.rate=0.95;u.pitch=1.05;speechSynthesis.speak(u)}
}

let typT=0,typI=null;
function beginTyping(text,idx){S.animI=idx;S.ok=false;typT=Date.now();clearInterval(typI);typI=setInterval(()=>{if(Math.floor((Date.now()-typT)/CHAR_SPEED)>=text.length){clearInterval(typI);S.animI=-1;S.ok=true}draw()},60);draw()}
function getTyped(full){return S.animI===-1?full.length:Math.min(Math.floor((Date.now()-typT)/CHAR_SPEED),full.length)}

// ─── STT ───
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,finalT="";
function toggleMic(){
  if(!SR){alert("Voice input not supported. Use Chrome or Edge.");return}
  if(S.listening){rec?.stop();S.listening=false;draw();return}
  finalT=S.input||"";rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang="en-US";
  rec.onresult=e=>{let f="",interim="";for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)f+=e.results[i][0].transcript;else interim+=e.results[i][0].transcript}if(f)finalT+=f;S.input=finalT+interim;draw()};
  rec.onend=()=>{if(S.listening)try{rec.start()}catch{S.listening=false;draw()}};
  rec.onerror=e=>{if(e.error!=="no-speech"){S.listening=false;draw()}};
  rec.start();S.listening=true;draw();
}

// ─── CLAUDE: Probe within a question ───
async function getProbe(q,resp,probes,ctx){
  try{const r=await fetch("/api/probe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q,response:resp,probes,context:ctx})});if(!r.ok)return null;const d=await r.json();return d.probe||null}catch{return null}
}
// ─── CLAUDE: Transition between questions (acknowledge + next Q) ───
async function getTransition(userResp,nextQ,ctx,section,prevSection){
  try{const r=await fetch("/api/transition",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userResponse:userResp,nextQuestion:nextQ,context:ctx,section,prevSection})});if(!r.ok)return null;const d=await r.json();return d.text||null}catch{return null}
}
function getContext(){return S.ans.map(a=>`Q: ${a.q}\nA: ${a.a}`).join("\n\n")}

// ─── STATE ───
let S={scr:"welcome",qi:0,ans:[],msgs:[],input:"",pc:0,cp:null,animI:-1,ok:false,tts:true,listening:false,thinking:false,allRes:[],insights:null,insL:false,lastRank:null,qStart:0};
let rkS={ranked:[],qid:null};
const $=id=>document.getElementById(id);

function start(){S={scr:"iv",qi:0,ans:[],msgs:[{r:"ai",t:QS[0].text}],input:"",pc:0,cp:null,animI:0,ok:false,tts:S.tts,listening:false,thinking:false,allRes:S.allRes,insights:null,insL:false,lastRank:null,qStart:0};rkS={ranked:[],qid:null};speakAndType(QS[0].text,0);draw()}

async function submit(){
  if(!S.input.trim()||!S.ok)return;
  const resp=S.input.trim();
  S.input="";finalT="";S.ok=false;S.listening=false;
  if(rec)try{rec.stop()}catch{}
  S.msgs.push({r:"u",t:resp});draw();
  const q=QS[S.qi];
  // Probe within current question
  if(q.type==="open"&&q.probes?.length&&S.pc<2){
    S.thinking=true;draw();
    const probe=await getProbe(S.cp||q.text,resp,q.probes.slice(S.pc),getContext());
    S.thinking=false;
    if(probe){S.pc++;S.cp=probe;S.msgs.push({r:"ai",t:probe});await speakAndType(probe,S.msgs.length-1);draw();return}
  }
  // Advance: collect only current question's responses
  const cMsgs=S.msgs.slice(S.qStart).filter(m=>m.r==="u").map(m=>m.t);
  await doAdv(cMsgs.join(" | "));
}

function onIx(result){
  const str=Array.isArray(result)?result.map((r,i)=>`${i+1}. ${r}`).join(", "):result;
  if(Array.isArray(result))S.lastRank={top:result[0],bottom:result[result.length-1]};
  S.msgs.push({r:"u",t:str});
  doAdv(str);
}

async function doAdv(resp){
  const q=QS[S.qi];
  S.ans.push({qid:q.id,q:q.text,section:q.section,a:resp});
  S.pc=0;S.cp=null;
  if(S.qi>=QS.length-1){finish();return}
  S.qi++;
  const nq=QS[S.qi];
  S.qStart=S.msgs.length;
  // Dynamic Q5b
  let nextQText=nq.text;
  if(nq.dynamic&&S.lastRank){
    nextQText=`You put "${S.lastRank.top}" at the top and "${S.lastRank.bottom}" at the bottom. Why does that top one win for you, and what puts the last one at the bottom?`;
  }
  // Get conversational transition from Claude
  S.thinking=true;draw();
  const transition=await getTransition(resp,nextQText,getContext(),nq.section,q.section);
  S.thinking=false;
  const finalText=transition||nextQText;
  S.msgs.push({r:"ai",t:finalText});
  await speakAndType(finalText,S.msgs.length-1);
  draw();
}

async function finish(){S.scr="thx";stopAll();clearInterval(typI);const rec={id:"r_"+Date.now(),ts:new Date().toISOString(),answers:S.ans};try{await fetch("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(rec)})}catch(e){console.error(e)}draw()}

window.rkTap=function(id){const q=QS[S.qi];rkS.ranked.push(q.opts.find(o=>o.id===id));if(rkS.ranked.length===q.opts.length)setTimeout(()=>onIx(rkS.ranked.map(r=>r.lb)),400);draw()};

async function loadAdmin(){S.scr="admin";try{const params=new URLSearchParams(location.search);const r=await fetch(`/api/responses?key=${params.get("admin")||"admin2026"}`);const d=await r.json();S.allRes=d.responses||[]}catch{S.allRes=[]}S.insights=null;draw()}
async function genIns(){S.insL=true;draw();try{const r=await fetch("/api/insights",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({responses:S.allRes})});const d=await r.json();S.insights=d.insights}catch{S.insights="Error."}S.insL=false;draw()}

function draw(){
  const el=$("app");
  if(S.scr==="welcome"){el.innerHTML=`<div class="scr welcome"><div class="logo">${ic("msg",28)}</div><h1>Consumer Research Interview</h1><p class="sub">Help us understand what makes surveys worth your time</p><p class="dsc">An AI moderator will guide you through a short conversation. You can respond by <strong>voice or text</strong>. Takes about 12\u201315 minutes.</p><button class="btn-go" onclick="start()">Start Interview ${ic("arr",18)}</button><p style="color:var(--tx3);font-size:.6rem;margin-top:2rem">Responses saved anonymously</p></div>`;return}
  if(S.scr==="thx"){el.innerHTML=`<div class="scr thx"><div class="chk">${ic("chk",28)}</div><h1>Thank you!</h1><p class="sub">Your responses have been saved.</p><p style="color:var(--tx3);font-size:.85rem;max-width:26rem;margin:0 auto 2rem">Your insights will directly shape how we build a better research experience.</p><button class="btn2" onclick="S.scr='welcome';draw()">Done</button></div>`;return}
  if(S.scr==="admin"){let cards="";if(!S.allRes.length)cards='<div style="text-align:center;padding:4rem 0;color:var(--tx3)"><p>No responses yet</p></div>';else S.allRes.forEach((r,i)=>{let body="";r.answers.forEach(a=>{body+=`<div class="qa"><div class="st">${a.section}</div><div class="qt">${a.q}</div><div class="at">${a.a}</div></div>`});cards+=`<details class="rc"><summary>Respondent ${i+1} <span style="font-size:.7rem;color:var(--tx3);margin-left:.5rem">${new Date(r.ts).toLocaleString()}</span></summary><div class="rc-body">${body}</div></details>`});const ins=S.insights?`<div class="ins-box"><h2>Aggregate Insights</h2><pre>${S.insights}</pre></div>`:"";const btn=S.allRes.length>=2?`<button class="btn-ins" onclick="genIns()" ${S.insL?"disabled":""}>${S.insL?"Analyzing...":ic("bar",16)+" Generate Insights"}</button>`:"";el.innerHTML=`<div class="scr" style="background:var(--bg)"><div class="admin"><button class="bk" onclick="S.scr='welcome';draw()">${ic("bk",14)} Back</button><div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:1.5rem"><div><h1>Interview Responses</h1><p class="cnt">${S.allRes.length} completed</p></div>${btn}</div>${ins}${cards}</div></div>`;return}
  const q=QS[S.qi];const pct=(S.qi/QS.length)*100;
  let ms="";S.msgs.forEach((m,i)=>{if(m.r==="ai"){const anim=i===S.animI;const txt=anim?m.t.slice(0,getTyped(m.t)):m.t;ms+=`<div class="m m-ai"><div class="b b-ai"><div class="ai-h"><div class="ai-d">${ic("msg",9)}</div><span class="ai-l">AI Moderator</span>${anim?'<div class="dots"><span></span><span></span><span></span></div>':''}${anim&&S.tts?'<div class="wave"><span></span><span></span><span></span><span></span></div>':''}</div><p>${txt}${anim?'<span class="cur"></span>':''}</p></div></div>`}else ms+=`<div class="m m-u"><div class="b b-u"><p>${m.t}</p></div></div>`});
  if(S.thinking)ms+='<div class="m m-ai"><div class="b b-ai"><div style="font-size:.7rem;color:var(--tx3)">Thinking...</div></div></div>';
  let ix="";
  if(S.ok&&q.type==="rank"){if(rkS.qid!==q.id)rkS={ranked:[],qid:q.id};const rem=q.opts.filter(o=>!rkS.ranked.find(r=>r.id===o.id));ix='<div class="ix">';if(q.inst)ix+=`<p class="ix-l">${q.inst}</p>`;if(rkS.ranked.length){ix+='<div class="ix-l" style="color:var(--teal);font-weight:600">Your ranking</div>';rkS.ranked.forEach((it,i)=>{ix+=`<div class="ri ri-d"><span class="rn">${i+1}</span>${it.lb}</div>`});if(rem.length)ix+='<button class="rst" onclick="rkS.ranked=[];draw()">Start over</button>'}if(rem.length){ix+=`<div class="ix-l" style="margin-top:.4rem">${rkS.ranked.length===0?"Tap the most important one first":"Tap #"+(rkS.ranked.length+1)}</div>`;rem.forEach(it=>{ix+=`<div class="ri" onclick="rkTap('${it.id}')">${it.lb}${it.ds?`<span class="rd">${it.ds}</span>`:""}</div>`})}ix+='</div>'}
  if(S.ok&&q.type==="select"){ix='<div class="ix"><p class="ix-l">Tap the one you\u2019d click on</p>';q.opts.forEach(o=>{const c={r:"oc-r",a:"oc-a",g:"oc-g"}[o.cl];ix+=`<button class="oc ${c}" onclick="onIx('${o.lb}: &quot;${o.tx.replace(/'/g,"\\'")}&quot;')"><div class="ol">${o.lb}</div><div class="ot">"${o.tx}"</div></button>`});ix+='</div>'}
  let inp="";if(q.type==="open"){inp=`<div class="inp"><div class="inp-in">${SR?`<button class="mic ${S.listening?"mic-on":"mic-off"}" onclick="toggleMic()">${S.listening?ic("micX",20):ic("mic",20)}</button>`:""}<textarea class="ti" id="ti" placeholder="${S.ok?(S.listening?"Speaking\u2026 tap mic when done":"Type or tap mic to respond\u2026"):"Listening\u2026"}" ${S.ok?"":"disabled"} rows="3" oninput="S.input=this.value" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submit()}">${S.input||""}</textarea><button class="snd" onclick="submit()" ${!S.input?.trim()||!S.ok?"disabled":""}>${ic("snd",20)}</button></div>${S.listening?'<p class="mic-st">Recording \u2014 speak naturally, tap mic when finished</p>':""}</div>`}
  el.innerHTML=`<div class="scr" style="background:var(--bg)"><div class="hdr"><div class="hdr-in"><div class="hdr-ico">${ic("msg",14)}</div><div><div class="hdr-sec">${q.section}</div><div class="hdr-q">Question ${S.qi+1} of ${QS.length}</div></div><div class="hdr-r"><button class="ib ${S.tts?"on":""}" onclick="S.tts=!S.tts;if(!S.tts)stopAll();draw()">${S.tts?ic("vol",16):ic("volX",16)}</button></div></div><div class="prog"><div class="prog-f" style="width:${pct}%"></div></div></div><div class="chat"><div class="chat-in">${ms}${ix}<div id="end"></div></div></div>${inp}</div>`;
  setTimeout(()=>{$("end")?.scrollIntoView({behavior:"smooth"});if(S.ok&&q.type==="open"){const t=$("ti");if(t){t.value=S.input||"";t.focus()}}},30);
}
const params=new URLSearchParams(location.search);if(params.has("admin"))loadAdmin();else draw();
</script>
</body>
</html>
